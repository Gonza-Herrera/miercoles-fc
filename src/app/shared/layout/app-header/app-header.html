<header class="app-header">
  <div class="app-header__content">
    <a class="app-header__brand" routerLink="/" aria-label="Miércoles FC, ir al inicio">
      <svg class="app-header__mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="m12 7 3 2.2-1.1 3.5h-3.8L9 9.2 12 7Z" fill="currentColor" />
        <path
          d="m12 3 0 4M20.6 9.2 15 9.2M17.3 19.3l-3.4-6.6M6.7 19.3l3.4-6.6M3.4 9.2H9"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
        />
      </svg>
      <span>Miércoles FC</span>
    </a>

    <div class="app-header__account">
      <button
        class="app-header__profile"
        type="button"
        aria-haspopup="dialog"
        aria-controls="account-panel"
        [attr.aria-expanded]="accountOpen()"
        [attr.aria-label]="'Cuenta de ' + auth.displayName()"
        (click)="toggleAccount()"
      >
        <app-avatar
          [name]="auth.displayName()"
          [src]="auth.profile()?.avatar_url ?? null"
          size="small"
        />
      </button>

      @if (accountOpen()) {
        <section id="account-panel" class="account-panel" role="dialog" aria-label="Tu cuenta">
          <div class="account-panel__identity">
            <strong>{{ auth.displayName() }}</strong>
            @if (auth.user()?.email; as email) {
              <span>{{ email }}</span>
            }
          </div>
          <app-button
            variant="ghost"
            size="small"
            [fullWidth]="true"
            [disabled]="isSigningOut()"
            (click)="signOut()"
          >
            {{ isSigningOut() ? 'Saliendo…' : 'Salir' }}
          </app-button>
          @if (logoutError(); as error) {
            <p class="account-panel__error" role="alert">{{ error }}</p>
          }
        </section>
      }
    </div>
  </div>
</header>
